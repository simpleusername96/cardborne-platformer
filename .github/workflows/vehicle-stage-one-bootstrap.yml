name: Install Vehicle Stage One Branch Snapshot

on:
  push:
    branches:
      - agent/vehicle-stage-one
  pull_request:
    branches:
      - master
    types:
      - opened
      - reopened
      - synchronize

permissions:
  contents: write

jobs:
  install-snapshot:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Check out feature branch
        uses: actions/checkout@v4
        with:
          ref: agent/vehicle-stage-one
          fetch-depth: 0

      - name: Expand task-owned snapshot
        shell: bash
        run: |
          set -euo pipefail
          cat tools/bootstrap/vehicle-stage-one.tar.gz.b64.part-* \
            | base64 --decode \
            | tar -xzf -
          rm -f .github/workflows/vehicle-stage-one-bootstrap.yml
          rm -f tools/bootstrap/vehicle-stage-one.tar.gz.b64.part-*
          rmdir tools/bootstrap 2>/dev/null || true

      - name: Commit implementation
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --check
          git commit -m 'feat: build vehicle-led Stage 1'
          git push origin HEAD:agent/vehicle-stage-one
