name: Apply Boss Implementation

on:
  pull_request:
    branches: [master]
    paths:
      - ".agents/tmp/apply/**"
      - ".github/workflows/branch-source-snapshot.yml"

permissions:
  contents: write

concurrency:
  group: apply-boss-implementation-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  apply:
    if: github.head_ref == 'codex/boss-shared-pattern-defense-rules' && github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: codex/boss-shared-pattern-defense-rules
          fetch-depth: 0

      - name: Decode and apply bounded patch
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import base64
          import gzip

          parts = sorted(Path('.agents/tmp/apply').glob('part-*.txt'))
          if not parts:
              raise SystemExit('No bounded implementation patch parts found.')
          encoded = ''.join(part.read_text().strip() for part in parts)
          compressed = base64.b64decode(encoded, validate=True)
          Path('/tmp/boss-implementation.patch').write_bytes(gzip.decompress(compressed))
          PY
          git apply --check /tmp/boss-implementation.patch
          git apply /tmp/boss-implementation.patch
          rm -rf .agents/tmp/apply
          rm -f .agents/tmp/implementation.patch.gz.b64
          rm -rf .agents/tmp/patch-recovery
          rm -f .github/workflows/branch-source-snapshot.yml
          git diff --check

      - name: Commit implementation
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "feat(boss): refine shared patterns and segmented defenses"
          git push origin HEAD:codex/boss-shared-pattern-defense-rules
