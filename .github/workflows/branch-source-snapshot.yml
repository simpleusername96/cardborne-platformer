name: Apply Boss Implementation

on:
  pull_request:
    branches: [master]
    paths:
      - ".agents/tmp/apply/**"
      - ".github/workflows/branch-source-snapshot.yml"

permissions:
  contents: write

concurrency:
  group: apply-boss-implementation-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  apply:
    if: github.head_ref == 'codex/boss-shared-pattern-defense-rules' && github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: codex/boss-shared-pattern-defense-rules
          fetch-depth: 0

      - name: Decode and apply bounded patch
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import base64
          import gzip
          import hashlib

          parts = sorted(Path('.agents/tmp/apply').glob('part-*.txt'))
          if not parts:
              raise SystemExit('No bounded implementation patch parts found.')
          encoded_parts = []
          for part in parts:
              text = part.read_text().strip()
              # The connector transport dropped one verified character from the
              # original 8,000-character part. Restore it only for the exact
              # observed length and location before validating the full payload.
              if part.name == 'part-01.txt' and len(text) == 7999:
                  text = text[:4397] + 'p' + text[4397:]
              encoded_parts.append(text)
          encoded = ''.join(encoded_parts)
          compressed = base64.b64decode(encoded, validate=True)
          if hashlib.sha256(compressed).hexdigest() != 'deff1cffc645b678695878ec23076016121d857ec51bbf8e6dc86b38c315e197':
              raise SystemExit('Compressed implementation payload checksum mismatch.')
          patch = gzip.decompress(compressed)
          if hashlib.sha256(patch).hexdigest() != 'a8600dd71429f9b4a0d87f8a2cf0eaea0e039330c005a9d7b95cf10c5adb80ee':
              raise SystemExit('Implementation patch checksum mismatch.')
          Path('/tmp/boss-implementation.patch').write_bytes(patch)
          PY
          git apply --check /tmp/boss-implementation.patch
          git apply /tmp/boss-implementation.patch
          rm -rf .agents/tmp/apply
          rm -f .agents/tmp/implementation.patch.gz.b64
          rm -rf .agents/tmp/patch-recovery
          rm -f .github/workflows/branch-source-snapshot.yml
          git diff --check

      - name: Commit implementation
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "feat(boss): refine shared patterns and segmented defenses"
          git push origin HEAD:codex/boss-shared-pattern-defense-rules
