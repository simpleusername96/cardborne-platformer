name: Branch Source Snapshot

on:
  pull_request:
    branches: [master]

permissions:
  contents: read

jobs:
  source-snapshot:
    if: github.head_ref == 'codex/boss-shared-pattern-defense-rules'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Check out pull-request head
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Package tracked branch source
        shell: bash
        run: |
          set -euo pipefail
          git archive --format=tar.gz --output="$RUNNER_TEMP/cardborne-source.tar.gz" HEAD

      - name: Upload source snapshot
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: cardborne-branch-source
          path: ${{ runner.temp }}/cardborne-source.tar.gz
          if-no-files-found: error
          retention-days: 1
