name: Repair Boss Validation Failure

on:
  pull_request:
    branches: [master]
    paths:
      - ".github/workflows/branch-source-snapshot.yml"

permissions:
  contents: write

concurrency:
  group: repair-boss-validation-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  repair:
    if: github.head_ref == 'codex/boss-shared-pattern-defense-rules' && github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Check out branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: codex/boss-shared-pattern-defense-rules
          fetch-depth: 0

      - name: Repair Guidebook expression and clean temporary files
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          path = Path('scripts/progression/vehicle_guidebook_stat_adapter.gd')
          text = path.read_text()
          old = '''\tif BossPhaseCatalog.uses_shield(stage_id):
          \t\tvar defense := BossPhaseCatalog.defense_profile(stage_id)
          \t\tif BossPhaseCatalog.defense_effect(stage_id) == &"guard":
          \t\t\trows.insert(2, _row(
          \t\t\t\t"GUIDE_STAT_BOSS_SHIELD", "GUIDE_VALUE_DAMAGE_REDUCTION",
          \t\t\t\t[roundi(
          \t\t\t\t\t(1.0 - float(defense.get("blocked_damage_multiplier", 1.0)))
          \t\t\t\t\t\t* 100.0
          \t\t\t\t)], &"protection"
          \t\t\t))
          '''
          new = '''\tif BossPhaseCatalog.uses_shield(stage_id):
          \t\tvar defense := BossPhaseCatalog.defense_profile(stage_id)
          \t\tif BossPhaseCatalog.defense_effect(stage_id) == &"guard":
          \t\t\tvar reduction_percent := roundi(
          \t\t\t\t(1.0 - float(defense.get("blocked_damage_multiplier", 1.0))) * 100.0
          \t\t\t)
          \t\t\trows.insert(2, _row(
          \t\t\t\t"GUIDE_STAT_BOSS_SHIELD", "GUIDE_VALUE_DAMAGE_REDUCTION",
          \t\t\t\t[reduction_percent], &"protection"
          \t\t\t))
          '''
          if old not in text:
              raise SystemExit('Expected Guidebook parser-failure block was not found.')
          path.write_text(text.replace(old, new, 1))
          PY
          rm -f .agents/tmp/validation-trigger.txt
          rm -f .github/workflows/branch-source-snapshot.yml
          git diff --check

      - name: Commit repair
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "fix(boss): repair defense Guidebook row"
          git push origin HEAD:codex/boss-shared-pattern-defense-rules
