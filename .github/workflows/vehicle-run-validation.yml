name: Vehicle Run Validation

on:
  push:
    branches: [master]
    paths-ignore:
      - ".agents/**"
      - "docs/**"
      - "screenshots/**"
      - ".editorconfig"
      - ".gitattributes"
      - ".gitignore"
      - "AGENTS.md"
      - "README.md"
  pull_request:
    branches: [master]
  workflow_dispatch:
    inputs:
      publish:
        description: Publish the verified Web build to itch.io
        required: true
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: vehicle-run-${{ github.ref }}
  cancel-in-progress: true

env:
  ITCH_GAME_TITLE: Cardborne

jobs:
  validate-build-render:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      GODOT_VERSION: 4.7.1
      GODOT_STATUS: stable
      GODOT_DIR: ${{ github.workspace }}/.ci-godot
      EVIDENCE_DIR: ${{ github.workspace }}/build/vehicle-run

    steps:
      - name: Check out branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Check deployment credential
        if: github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.publish)
        shell: pwsh
        env:
          BUTLER_API_KEY: ${{ secrets.BUTLER_API_KEY }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:BUTLER_API_KEY)) {
              throw 'The BUTLER_API_KEY GitHub Actions secret is missing.'
          }

      - name: Resolve itch.io project target
        if: github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.publish)
        shell: pwsh
        env:
          BUTLER_API_KEY: ${{ secrets.BUTLER_API_KEY }}
        run: |
          Set-StrictMode -Version Latest
          $ErrorActionPreference = 'Stop'

          $headers = @{ Authorization = "Bearer $env:BUTLER_API_KEY" }
          $profile = Invoke-RestMethod -Uri 'https://api.itch.io/profile' -Headers $headers
          $response = Invoke-RestMethod -Uri 'https://api.itch.io/profile/games' -Headers $headers
          $matches = @($response.games | Where-Object { $_.title -ceq $env:ITCH_GAME_TITLE })
          if ($matches.Count -ne 1) {
              throw "Expected one itch.io project titled '$env:ITCH_GAME_TITLE', found $($matches.Count)."
          }

          $gameUrl = [Uri]$matches[0].url
          if ($gameUrl.Scheme -ne 'https' -or -not $gameUrl.Host.EndsWith('.itch.io')) {
              throw "Unexpected itch.io project URL: $gameUrl"
          }
          $username = $gameUrl.Host.Substring(0, $gameUrl.Host.Length - '.itch.io'.Length)
          $slug = $gameUrl.AbsolutePath.Trim('/')
          if ([string]::IsNullOrWhiteSpace($username) -or
              [string]::IsNullOrWhiteSpace($slug) -or $slug.Contains('/')) {
              throw "Could not derive a Butler target from $gameUrl"
          }
          if ([string]$profile.user.username -ne $username) {
              throw "The API key belongs to '$($profile.user.username)', but the project belongs to '$username'."
          }

          $target = "${username}/${slug}:html5"
          "ITCH_WEB_TARGET=$target" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "ITCH_GAME_URL=$($gameUrl.AbsoluteUri.TrimEnd('/'))" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          Write-Host "Resolved itch.io project: $($gameUrl.AbsoluteUri)"

      - name: Validate document authority
        shell: pwsh
        run: ./tools/validation/validate_document_authority.ps1

      - name: Cache Godot editor and export templates
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: .ci-godot/cache
          key: godot-${{ runner.os }}-4.7.1-stable-editor-templates

      - name: Install system render dependencies
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends xvfb libgl1 libglx-mesa0 libasound2t64

      - name: Install official Godot editor and Web templates
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$GODOT_DIR/cache" "$GODOT_DIR/editor" "$RUNNER_TEMP/godot-templates"
          editor_zip="$GODOT_DIR/cache/Godot_v${GODOT_VERSION}-${GODOT_STATUS}_linux.x86_64.zip"
          templates_tpz="$GODOT_DIR/cache/Godot_v${GODOT_VERSION}-${GODOT_STATUS}_export_templates.tpz"
          release_root="https://github.com/godotengine/godot-builds/releases/download/${GODOT_VERSION}-${GODOT_STATUS}"
          editor_sha512="4CCDAB7A48EECCBE8819A2FC1F6262F8D72065D98601BCB3743FCBD7EBD39F373758A788EE3293A05EC5B2C48538266C437404312E372225CD2DF273945A2DE9"
          templates_sha512="AFCC83D8D3D298038F19C58744A0D660FA75DD4BAA33CB55D1011BB2565A2A8C2381728924564CB909E37C205A23F21B521B23BD057993AFD43AE4DA0B2F9D47"

          download_and_verify() {
            local url="$1"
            local destination="$2"
            local expected_sha512="$3"
            if [[ -s "$destination" ]] && echo "$expected_sha512  $destination" | sha512sum --check --status; then
              return
            fi
            rm -f "$destination"
            curl --fail --location --retry 4 --retry-all-errors "$url" --output "$destination"
            echo "$expected_sha512  $destination" | sha512sum --check
          }

          download_and_verify \
            "$release_root/Godot_v${GODOT_VERSION}-${GODOT_STATUS}_linux.x86_64.zip" \
            "$editor_zip" \
            "$editor_sha512"
          download_and_verify \
            "$release_root/Godot_v${GODOT_VERSION}-${GODOT_STATUS}_export_templates.tpz" \
            "$templates_tpz" \
            "$templates_sha512"
          rm -rf "$GODOT_DIR/editor" "$RUNNER_TEMP/godot-templates"
          mkdir -p "$GODOT_DIR/editor" "$RUNNER_TEMP/godot-templates"
          unzip -q "$editor_zip" -d "$GODOT_DIR/editor"
          godot_bin="$(find "$GODOT_DIR/editor" -maxdepth 1 -type f -name 'Godot*linux*x86_64' | head -n 1)"
          test -n "$godot_bin"
          chmod +x "$godot_bin"
          echo "GODOT_BIN=$godot_bin" >> "$GITHUB_ENV"
          template_dir="$HOME/.local/share/godot/export_templates/${GODOT_VERSION}.${GODOT_STATUS}"
          rm -rf "$template_dir"
          mkdir -p "$template_dir"
          unzip -q "$templates_tpz" -d "$RUNNER_TEMP/godot-templates"
          cp -a "$RUNNER_TEMP/godot-templates/templates/." "$template_dir/"
          "$godot_bin" --version | tee "$GODOT_DIR/godot-version.txt"

      - name: Import project headlessly
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$EVIDENCE_DIR/logs"
          "$GODOT_BIN" --path . --headless --import 2>&1 | tee "$EVIDENCE_DIR/logs/import.log"

      - name: Validate current vehicle contracts
        shell: bash
        run: |
          set -euo pipefail
          mapfile -d '' validators < <(
            find tools/validation -maxdepth 1 -type f -name 'validate_*.gd' -print0 |
              sort -z
          )
          test "${#validators[@]}" -gt 0
          for validator in "${validators[@]}"; do
            "$GODOT_BIN" --path . --headless \
              --script "res://$validator" \
              2>&1 | tee "$EVIDENCE_DIR/logs/$(basename "${validator%.gd}").log"
          done

      - name: Run pressure subsystem diagnostic
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          "$GODOT_BIN" --path . --headless \
            --script res://tools/validation/profile_vehicle_pressure.gd \
            2>&1 | tee "$EVIDENCE_DIR/logs/profile_vehicle_pressure.log"

      - name: Capture native rendered evidence
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$EVIDENCE_DIR/captures"
          xvfb-run -a "$GODOT_BIN" --path . --rendering-method gl_compatibility \
            -- --capture-all="$EVIDENCE_DIR/captures" --capture-locale=ko --capture-size=1280x720 \
            2>&1 | tee "$EVIDENCE_DIR/logs/native-capture.log"
          test "$(find "$EVIDENCE_DIR/captures" -maxdepth 1 -name '*.png' | wc -l)" -ge 20

      - name: Export Web release
        shell: bash
        run: |
          set -euo pipefail
          rm -rf build/web
          mkdir -p build/web
          "$GODOT_BIN" --path . --headless --export-release Web build/web/index.html \
            2>&1 | tee "$EVIDENCE_DIR/logs/web-export.log"
          for file in index.html index.js index.pck index.wasm; do
            test -s "build/web/$file"
          done

          short_commit="${GITHUB_SHA:0:7}"
          build_version="alpha.${GITHUB_RUN_NUMBER}+${short_commit}"
          pck_sha256="$(sha256sum build/web/index.pck | cut -d ' ' -f 1)"
          {
            echo 'Cardborne itch.io Web alpha build'
            echo "version=$build_version"
            echo "commit=$GITHUB_SHA"
            echo "built_at=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
            echo "pck_sha256=$pck_sha256"
          } > build/web/build-info.txt
          web_build_bytes="$(find build/web -type f -printf '%s\n' | awk '{ total += $1 } END { print total }')"
          echo "BUILD_VERSION=$build_version" >> "$GITHUB_ENV"
          echo "WEB_BUILD_SHA256=$pck_sha256" >> "$GITHUB_ENV"
          echo "WEB_BUILD_BYTES=$web_build_bytes" >> "$GITHUB_ENV"

      - name: Validate itch.io Web release contract
        shell: pwsh
        run: ./tools/validation/validate_itch_web_release.ps1 -ReleaseDirectory build/web

      - name: Boot and render the built Web artifact
        shell: bash
        run: |
          set -euo pipefail
          python3 -m http.server 8060 --directory build/web >"$EVIDENCE_DIR/logs/web-server.log" 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          for _ in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:8060/index.html >/dev/null; then break; fi
            sleep 1
          done
          browser="$(command -v google-chrome || command -v chromium || command -v chromium-browser || true)"
          test -n "$browser"
          "$browser" --headless=new --no-sandbox --hide-scrollbars \
            --window-size=1280,720 --use-gl=swiftshader --enable-webgl --ignore-gpu-blocklist \
            --virtual-time-budget=10000 \
            --screenshot="$EVIDENCE_DIR/captures/99-web-build-boot.png" \
            http://127.0.0.1:8060/ \
            >"$EVIDENCE_DIR/logs/browser-boot.log" 2>&1
          test -s "$EVIDENCE_DIR/captures/99-web-build-boot.png"
          curl --fail --silent http://127.0.0.1:8060/index.pck >/dev/null

      - name: Record evidence manifest
        shell: bash
        run: |
          set -euo pipefail
          {
            echo "commit=${GITHUB_SHA}"
            echo "godot=$($GODOT_BIN --version)"
            echo "captures=$(find "$EVIDENCE_DIR/captures" -maxdepth 1 -name '*.png' | wc -l)"
            echo "web_files=$(find build/web -maxdepth 1 -type f | wc -l)"
            echo "generated_utc=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          } > "$EVIDENCE_DIR/manifest.txt"
          find "$EVIDENCE_DIR" -maxdepth 2 -type f -printf '%P %s bytes\n' | sort

      - name: Publish verified Web build to itch.io
        if: github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.publish)
        shell: pwsh
        env:
          BUTLER_API_KEY: ${{ secrets.BUTLER_API_KEY }}
        run: |
          Set-StrictMode -Version Latest
          $ErrorActionPreference = 'Stop'

          $butlerArchive = Join-Path $env:RUNNER_TEMP 'butler-linux-amd64-v15.30.0.zip'
          $butlerUrl = 'https://github.com/itchio/butler/releases/download/v15.30.0/butler-linux-amd64.zip'
          Invoke-WebRequest -UseBasicParsing -Uri $butlerUrl -OutFile $butlerArchive
          $butlerHash = (Get-FileHash -LiteralPath $butlerArchive -Algorithm SHA256).Hash
          $expectedButlerHash = 'F2CAE7D24EBA0605048F71D0CC056F65C3B7FF9F73724F504C731CF3645BEF08'
          if ($butlerHash -ne $expectedButlerHash) {
              throw "Butler checksum mismatch. Expected $expectedButlerHash, received $butlerHash."
          }

          $butlerRoot = Join-Path $env:RUNNER_TEMP 'butler-v15.30.0'
          Expand-Archive -LiteralPath $butlerArchive -DestinationPath $butlerRoot -Force
          $butlerPath = Join-Path $butlerRoot 'linux-amd64/butler'
          if (-not (Test-Path -LiteralPath $butlerPath -PathType Leaf)) {
              throw 'The Butler archive did not contain linux-amd64/butler.'
          }
          & chmod '+x' '--' $butlerPath
          & $butlerPath version
          if ($LASTEXITCODE -ne 0) {
              throw 'Butler version check failed.'
          }

          & $butlerPath push build/web $env:ITCH_WEB_TARGET --userversion $env:BUILD_VERSION
          if ($LASTEXITCODE -ne 0) {
              throw "Butler Web push failed with exit code $LASTEXITCODE."
          }

          @(
              '### itch.io Web deployment'
              ''
              "- Browser channel: ``$env:ITCH_WEB_TARGET``"
              "- Version: ``$env:BUILD_VERSION``"
              "- Commit: ``$env:GITHUB_SHA``"
              "- Extracted bytes: ``$env:WEB_BUILD_BYTES``"
              "- index.pck SHA-256: ``$env:WEB_BUILD_SHA256``"
          ) | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Encoding utf8 -Append

      - name: Upload rendered evidence and logs
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: vehicle-run-evidence
          path: build/vehicle-run
          if-no-files-found: warn
          retention-days: 30

      - name: Upload playable Web build
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: vehicle-run-web
          path: build/web
          if-no-files-found: warn
          retention-days: 30
