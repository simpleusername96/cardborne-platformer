<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <rect width="512" height="512" fill="#101722"/>

  <!-- Palette and constraints. This header is reference metadata, not tile art. -->
  <g shape-rendering="crispEdges">
    <rect x="16" y="12" width="32" height="16" fill="#05070D"/>
    <rect x="50" y="12" width="32" height="16" fill="#0A1019"/>
    <rect x="84" y="12" width="32" height="16" fill="#202833"/>
    <rect x="118" y="12" width="32" height="16" fill="#293440"/>
    <rect x="152" y="12" width="32" height="16" fill="#141B24"/>
    <rect x="186" y="12" width="32" height="16" fill="#44515E"/>
    <rect x="220" y="12" width="32" height="16" fill="#222B35"/>
    <rect x="254" y="12" width="32" height="16" fill="#65A9B8"/>
    <rect x="288" y="12" width="32" height="16" fill="#D9A83D"/>
    <rect x="322" y="12" width="32" height="16" fill="#D84B5F"/>
    <rect x="356" y="12" width="32" height="16" fill="#75C4B2"/>
    <rect x="390" y="12" width="32" height="16" fill="#B73D73"/>
    <rect x="424" y="12" width="32" height="16" fill="#E8EEF0"/>
  </g>
  <text x="16" y="48" fill="#E8EEF0" font-family="Arial, sans-serif"
        font-size="11" font-weight="700">FLAT PIXEL CLUSTERS · NO GRADIENT · NO DITHER · NO TEXT IN OUTPUT</text>

  <!-- Four-by-four 112 px concept grid. Labels define function only. -->
  <g stroke="#65A9B8" stroke-width="2" fill="#18212C">
    <rect x="32" y="64" width="112" height="112"/>
    <rect x="144" y="64" width="112" height="112"/>
    <rect x="256" y="64" width="112" height="112"/>
    <rect x="368" y="64" width="112" height="112"/>

    <rect x="32" y="176" width="112" height="112"/>
    <rect x="144" y="176" width="112" height="112"/>
    <rect x="256" y="176" width="112" height="112"/>
    <rect x="368" y="176" width="112" height="112"/>

    <rect x="32" y="288" width="112" height="112"/>
    <rect x="144" y="288" width="112" height="112"/>
    <rect x="256" y="288" width="112" height="112"/>
    <rect x="368" y="288" width="112" height="112"/>

    <rect x="32" y="400" width="112" height="112"/>
    <rect x="144" y="400" width="112" height="112"/>
    <rect x="256" y="400" width="112" height="112"/>
    <rect x="368" y="400" width="112" height="112"/>
  </g>

  <g fill="#E8EEF0" font-family="Arial, sans-serif" font-size="11"
     font-weight="700" text-anchor="middle">
    <text x="88" y="84">SPACE VOID</text>
    <text x="200" y="84">FLOOR BASE</text>
    <text x="312" y="84">FLOOR PANEL</text>
    <text x="424" y="84">FLOOR GRATE</text>

    <text x="88" y="196">RIM NORTH</text>
    <text x="200" y="196">RIM EAST</text>
    <text x="312" y="196">RIM SOUTH</text>
    <text x="424" y="196">RIM WEST</text>

    <text x="88" y="308">WALL NORTH</text>
    <text x="200" y="308">WALL EAST</text>
    <text x="312" y="308">WALL SOUTH</text>
    <text x="424" y="308">WALL WEST</text>

    <text x="88" y="420">CORNER NW</text>
    <text x="200" y="420">CORNER NE</text>
    <text x="312" y="420">CORNER SW</text>
    <text x="424" y="420">CORNER SE</text>
  </g>

  <!-- Inner safe areas make the intended coarse detail scale visible. -->
  <g fill="none" stroke="#44515E" stroke-width="1" stroke-dasharray="4 4">
    <rect x="44" y="92" width="88" height="72"/>
    <rect x="156" y="92" width="88" height="72"/>
    <rect x="268" y="92" width="88" height="72"/>
    <rect x="380" y="92" width="88" height="72"/>
    <rect x="44" y="204" width="88" height="72"/>
    <rect x="156" y="204" width="88" height="72"/>
    <rect x="268" y="204" width="88" height="72"/>
    <rect x="380" y="204" width="88" height="72"/>
    <rect x="44" y="316" width="88" height="72"/>
    <rect x="156" y="316" width="88" height="72"/>
    <rect x="268" y="316" width="88" height="72"/>
    <rect x="380" y="316" width="88" height="72"/>
    <rect x="44" y="428" width="88" height="72"/>
    <rect x="156" y="428" width="88" height="72"/>
    <rect x="268" y="428" width="88" height="72"/>
    <rect x="380" y="428" width="88" height="72"/>
  </g>
