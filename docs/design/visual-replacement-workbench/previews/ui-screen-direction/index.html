<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Cardborne UI Screen Direction</title>
  <style>
    :root{color-scheme:dark;--bg:#070b11;--surface:#101923;--raised:#182431;--line:#465a6e;--text:#eef3f7;--muted:#9eadbc;--amber:#f2b735;--cyan:#58bfea;--focus:#fff2a8;font-family:"Noto Sans KR","Segoe UI",sans-serif}
    *{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);line-height:1.5}button,a{font:inherit}:focus-visible{outline:3px solid var(--focus);outline-offset:3px}
    header{padding:28px clamp(18px,4vw,64px) 24px;border-bottom:1px solid var(--line);background:var(--surface)}.eyebrow{margin:0;color:var(--cyan);font-size:.8rem;font-weight:800;letter-spacing:.12em;text-transform:uppercase}h1{margin:6px 0 8px;font-size:clamp(2rem,5vw,3.5rem);line-height:1.1}header p{max-width:78ch;margin:0;color:var(--muted)}.actions{display:flex;flex-wrap:wrap;gap:10px;margin-top:20px}.actions a,.actions button{display:inline-flex;align-items:center;min-height:44px;padding:0 16px;color:var(--text);background:transparent;border:1px solid var(--line);border-radius:4px;text-decoration:none;cursor:pointer}.actions a:hover,.actions button:hover{border-color:var(--cyan)}
    main{padding:24px clamp(14px,3vw,48px) 64px}.principle{max-width:78ch;margin:0 0 24px;color:var(--muted)}.gallery{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:24px}.screen{min-width:0;margin:0}.screen h2{margin:0 0 6px;font-size:1.2rem}.screen p{min-height:3em;margin:0 0 10px;color:var(--muted)}.image-button{display:block;width:100%;padding:0;overflow:hidden;background:var(--surface);border:1px solid var(--line);border-radius:4px;cursor:zoom-in}.image-button:hover{border-color:var(--cyan)}.image-button img{display:block;width:100%;height:auto;aspect-ratio:1672/941;object-fit:contain;background:var(--surface)}code{display:block;margin-top:8px;color:var(--muted);font-size:.78rem;overflow-wrap:anywhere}
    dialog{width:min(96vw,1680px);max-height:94vh;padding:12px;background:var(--surface);color:var(--text);border:1px solid var(--line);border-radius:4px}dialog::backdrop{background:#000d}.dialog-head{display:flex;align-items:center;justify-content:space-between;gap:16px}.dialog-head button{min-height:44px;padding:0 16px;color:var(--text);background:transparent;border:1px solid var(--line);border-radius:4px;cursor:pointer}.dialog-image{display:block;max-width:100%;max-height:82vh;margin:12px auto 0;object-fit:contain}
    @media(max-width:900px){.gallery{grid-template-columns:1fr}.screen p{min-height:0}}
    @media(prefers-reduced-motion:reduce){*,*::before,*::after{scroll-behavior:auto!important;animation:none!important;transition:none!important}}
  </style>
</head>
<body>
  <header>
    <p class="eyebrow" data-ko="검토 전용 · UI 화면 방향" data-en="REVIEW ONLY · UI SCREEN DIRECTION">검토 전용 · UI 화면 방향</p>
    <h1 data-ko="Cardborne UI 화면 개선 시안" data-en="Cardborne UI screen direction">Cardborne UI 화면 개선 시안</h1>
    <p data-ko="현재 정보와 기능은 유지하고, 공용 Surface·TextRow·Command·Selectable·Meter로 UI 껍데기만 단순화한 구현 기준 시안입니다. 이 PNG들은 런타임 배포 에셋이 아닙니다." data-en="These implementation-direction previews preserve current information and behavior while simplifying UI chrome into shared Surface, TextRow, Command, Selectable, and Meter primitives. These PNGs are not runtime deliverables.">현재 정보와 기능은 유지하고, 공용 Surface·TextRow·Command·Selectable·Meter로 UI 껍데기만 단순화한 구현 기준 시안입니다. 이 PNG들은 런타임 배포 에셋이 아닙니다.</p>
    <div class="actions"><a href="../../index.html" data-ko="워크벤치로 돌아가기" data-en="Back to workbench">워크벤치로 돌아가기</a><button id="language-toggle" type="button" aria-pressed="false">English</button></div>
  </header>
  <main>
    <p class="principle" data-ko="공통 원칙: 정보 삭제 없음 · 어려움 고정 · 불필요한 선/점/프레임 제거 · 한 화면 한 primary action · 같은 역할은 같은 컴포넌트 재사용" data-en="Shared rules: preserve information · fixed Hard difficulty · remove unnecessary lines, dots, and frames · one primary action per screen · reuse one component for each role">공통 원칙: 정보 삭제 없음 · 어려움 고정 · 불필요한 선/점/프레임 제거 · 한 화면 한 primary action · 같은 역할은 같은 컴포넌트 재사용</p>
    <section class="gallery" aria-label="UI screen previews">
      <figure class="screen"><h2 data-ko="01 · 출격 준비" data-en="01 · Deployment">01 · 출격 준비</h2><p data-ko="조작 정보와 무장을 유지하고, 구분선과 장식 프레임을 공용 정렬 체계로 대체합니다." data-en="Preserve controls and loadout while replacing ornamental frames and separators with shared alignment.">조작 정보와 무장을 유지하고, 구분선과 장식 프레임을 공용 정렬 체계로 대체합니다.</p><button class="image-button" type="button" data-file="01-deployment.png" data-title-ko="출격 준비" data-title-en="Deployment"><img src="01-deployment.png" width="1672" height="941" alt="출격 준비 UI 개선 시안"></button><code>01-deployment.png</code></figure>
      <figure class="screen"><h2 data-ko="02 · 게임플레이 HUD" data-en="02 · Gameplay HUD">02 · 게임플레이 HUD</h2><p data-ko="HUD 정보는 유지하고, 화면 가장자리의 반복 장식과 서로 다른 패널 모양을 정리합니다." data-en="Preserve HUD information while removing repeated edge decoration and competing panel shapes.">HUD 정보는 유지하고, 화면 가장자리의 반복 장식과 서로 다른 패널 모양을 정리합니다.</p><button class="image-button" type="button" data-file="02-gameplay-hud.png" data-title-ko="게임플레이 HUD" data-title-en="Gameplay HUD"><img src="02-gameplay-hud.png" width="1672" height="941" alt="게임플레이 HUD 개선 시안" loading="lazy"></button><code>02-gameplay-hud.png</code></figure>
      <figure class="screen"><h2 data-ko="03 · 업그레이드 선택" data-en="03 · Upgrade choice">03 · 업그레이드 선택</h2><p data-ko="세 선택지의 정보는 유지하고, 하나의 Selectable 카드 골격과 선택 rail만 재사용합니다." data-en="Preserve all three choices while reusing one Selectable card skeleton and one selection rail.">세 선택지의 정보는 유지하고, 하나의 Selectable 카드 골격과 선택 rail만 재사용합니다.</p><button class="image-button" type="button" data-file="03-upgrade-choice.png" data-title-ko="업그레이드 선택" data-title-en="Upgrade choice"><img src="03-upgrade-choice.png" width="1672" height="941" alt="업그레이드 선택 UI 개선 시안" loading="lazy"></button><code>03-upgrade-choice.png</code></figure>
      <figure class="screen"><h2 data-ko="04 · 일시정지" data-en="04 · Pause">04 · 일시정지</h2><p data-ko="모든 행동을 유지하되 Resume만 강조하고 나머지는 같은 Command 골격의 역할 변형으로 표현합니다." data-en="Keep every action, emphasize Resume, and express the rest as role variants of one Command skeleton.">모든 행동을 유지하되 Resume만 강조하고 나머지는 같은 Command 골격의 역할 변형으로 표현합니다.</p><button class="image-button" type="button" data-file="04-pause.png" data-title-ko="일시정지" data-title-en="Pause"><img src="04-pause.png" width="1672" height="941" alt="일시정지 UI 개선 시안" loading="lazy"></button><code>04-pause.png</code></figure>
      <figure class="screen"><h2 data-ko="05 · 설정" data-en="05 · Settings">05 · 설정</h2><p data-ko="카테고리와 설정 행을 유지하고, boxed tab과 행별 패널을 단순한 rail과 정렬로 대체합니다." data-en="Preserve categories and rows while replacing boxed tabs and row panels with a simple rail and alignment.">카테고리와 설정 행을 유지하고, boxed tab과 행별 패널을 단순한 rail과 정렬로 대체합니다.</p><button class="image-button" type="button" data-file="05-settings.png" data-title-ko="설정" data-title-en="Settings"><img src="05-settings.png" width="1672" height="941" alt="설정 UI 개선 시안" loading="lazy"></button><code>05-settings.png</code></figure>
      <figure class="screen"><h2 data-ko="06 · 가이드북" data-en="06 · Guidebook">06 · 가이드북</h2><p data-ko="세 열의 정보 구조는 유지하고, 목록과 상세를 borderless TextRow 중심으로 통일합니다." data-en="Preserve the three-column structure while unifying lists and details around borderless TextRow primitives.">세 열의 정보 구조는 유지하고, 목록과 상세를 borderless TextRow 중심으로 통일합니다.</p><button class="image-button" type="button" data-file="06-guidebook.png" data-title-ko="가이드북" data-title-en="Guidebook"><img src="06-guidebook.png" width="1672" height="941" alt="가이드북 UI 개선 시안" loading="lazy"></button><code>06-guidebook.png</code></figure>
      <figure class="screen"><h2 data-ko="07 · 스테이지 리포트" data-en="07 · Stage report">07 · 스테이지 리포트</h2><p data-ko="세 데이터 열을 유지하고, 개별 카드 대신 공용 MetricRow와 여백으로 읽기 순서를 만듭니다." data-en="Preserve all three data columns while using shared MetricRows and spacing instead of individual cards.">세 데이터 열을 유지하고, 개별 카드 대신 공용 MetricRow와 여백으로 읽기 순서를 만듭니다.</p><button class="image-button" type="button" data-file="07-stage-report.png" data-title-ko="스테이지 리포트" data-title-en="Stage report"><img src="07-stage-report.png" width="1672" height="941" alt="스테이지 리포트 UI 개선 시안" loading="lazy"></button><code>07-stage-report.png</code></figure>
      <figure class="screen"><h2 data-ko="08 · 차고" data-en="08 · Garage">08 · 차고</h2><p data-ko="장비·모듈·런 빌드를 유지하고, 어려움 고정 흐름에 맞춰 출격 준비와 설정만 명확히 구분합니다." data-en="Preserve equipment, modules, and run build while clearly separating Deployment Setup and Settings for the fixed-Hard flow.">장비·모듈·런 빌드를 유지하고, 어려움 고정 흐름에 맞춰 출격 준비와 설정만 명확히 구분합니다.</p><button class="image-button" type="button" data-file="08-garage.png" data-title-ko="차고" data-title-en="Garage"><img src="08-garage.png" width="1672" height="941" alt="차고 UI 개선 시안" loading="lazy"></button><code>08-garage.png</code></figure>
    </section>
  </main>
  <dialog id="image-dialog" aria-labelledby="dialog-title"><div class="dialog-head"><strong id="dialog-title"></strong><button id="dialog-close" type="button" data-ko="닫기" data-en="Close">닫기</button></div><img class="dialog-image" alt=""></dialog>
  <script>
    (()=>{'use strict';let lang='ko',lastFocus=null;const dialog=document.getElementById('image-dialog'),dialogImage=dialog.querySelector('img'),dialogTitle=document.getElementById('dialog-title'),toggle=document.getElementById('language-toggle');function applyLanguage(){document.documentElement.lang=lang;document.querySelectorAll('[data-ko][data-en]').forEach(el=>el.textContent=el.dataset[lang]);document.querySelectorAll('.image-button').forEach(button=>{const image=button.querySelector('img'),title=button.dataset[lang==='ko'?'titleKo':'titleEn'];image.alt=title+(lang==='ko'?' UI 개선 시안':' UI direction preview')});toggle.textContent=lang==='ko'?'English':'한국어';toggle.setAttribute('aria-pressed',lang==='en')}document.querySelectorAll('.image-button').forEach(button=>button.addEventListener('click',()=>{lastFocus=button;dialogTitle.textContent=button.dataset[lang==='ko'?'titleKo':'titleEn'];dialogImage.src=button.dataset.file;dialogImage.alt=dialogTitle.textContent;dialog.showModal();document.getElementById('dialog-close').focus()}));document.getElementById('dialog-close').addEventListener('click',()=>dialog.close());dialog.addEventListener('click',event=>{if(event.target===dialog)dialog.close()});dialog.addEventListener('close',()=>lastFocus?.focus());toggle.addEventListener('click',()=>{lang=lang==='ko'?'en':'ko';applyLanguage()});applyLanguage()})();
  </script>
</body>
</html>
