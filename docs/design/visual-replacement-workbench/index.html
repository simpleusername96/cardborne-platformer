<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Cardborne Visual Replacement Workbench</title>
  <style>
    :root{color-scheme:dark;--bg:#081015;--panel:#101b22;--panel2:#17242d;--line:#35505f;--text:#eef5f7;--muted:#a9bbc3;--cyan:#68d6e8;--amber:#f2bb62;--red:#ef7c78;--green:#72d39a;--focus:#fff2a8;--r:6px;font-family:"Noto Sans KR","Segoe UI",sans-serif}
    *{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);line-height:1.5}button,input,select{font:inherit}button,select,input{color:inherit;background:#101b22;border:1px solid var(--line);border-radius:var(--r)}button,select{min-height:44px}button{cursor:pointer}button:hover{border-color:var(--cyan)}:focus-visible{outline:3px solid var(--focus);outline-offset:2px}
    header{padding:28px clamp(18px,4vw,64px);border-bottom:1px solid var(--line);background:linear-gradient(115deg,#10202a,#091218 70%)}.eyebrow{color:var(--cyan);font-size:.78rem;font-weight:800;letter-spacing:.14em;text-transform:uppercase}h1{margin:.3rem 0 .5rem;font-size:clamp(1.8rem,4vw,3.3rem);line-height:1.05}header p{max-width:72ch;color:var(--muted)}.top-actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:18px}.language{padding:0 18px}
    main{padding:24px clamp(14px,3vw,48px) 60px}.metrics{display:grid;grid-template-columns:repeat(5,minmax(130px,1fr));gap:10px}.metric{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:14px}.metric strong{display:block;font-size:1.6rem}.metric span{color:var(--muted);font-size:.84rem}
    .filters{display:grid;grid-template-columns:minmax(220px,2fr) repeat(3,minmax(150px,1fr));gap:10px;margin:18px 0}.field{display:grid;gap:5px}.field label{font-size:.82rem;color:var(--muted)}.field input,.field select{width:100%;height:44px;padding:0 12px}.result{color:var(--muted);min-height:24px}
    .category{margin-top:30px}.category-head{display:flex;justify-content:space-between;align-items:end;border-bottom:1px solid var(--line);padding-bottom:8px}.category h2{margin:0;font-size:1.25rem}.unit-list{display:grid;gap:12px;margin-top:12px}.unit{background:var(--panel);border:1px solid var(--line);border-radius:var(--r)}.unit summary{display:grid;grid-template-columns:minmax(220px,1fr) auto auto;gap:12px;align-items:center;min-height:62px;padding:10px 14px;cursor:pointer}.unit summary:hover{background:var(--panel2)}.unit-title small{display:block;color:var(--muted)}.pill{border:1px solid var(--line);border-radius:999px;padding:4px 9px;font-size:.76rem;white-space:nowrap}.target_required{color:var(--amber)}.keep_current,.applied{color:var(--green)}.approved_for_switch{color:var(--cyan)}.retired{color:var(--muted)}.switch_ready{color:#d5b5ff}
    .unit-body{padding:0 14px 16px}.direction{max-width:90ch;color:var(--muted)}.comparison{display:grid;grid-template-columns:1fr 1fr;gap:12px}.side,.preview-panel,.contract{background:#0b151b;border:1px solid #29404d;border-radius:var(--r);padding:12px;min-width:0}.side h3,.preview-panel h3,.contract h3{margin:0 0 10px;font-size:.9rem;color:var(--cyan)}.files{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:8px}.file{background:var(--panel2);border:1px solid #29404d;border-radius:var(--r);padding:8px;min-width:0}.file button{width:100%;padding:0;overflow:hidden;background:#071015}.file img{display:block;width:100%;height:120px;object-fit:contain;background:repeating-conic-gradient(#111d24 0 25%,#0b141a 0 50%) 50%/16px 16px}.path{display:block;margin-top:6px;font-family:ui-monospace,Consolas,monospace;font-size:.72rem;overflow-wrap:anywhere}.meta{color:var(--muted);font-size:.75rem}.missing{display:grid;place-items:center;height:120px;border:1px dashed var(--line);color:var(--amber);text-align:center;padding:8px}.preview-panel{margin-top:12px;border-color:var(--amber)}.preview-panel h3{color:var(--amber)}.contracts{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px;margin-top:12px}.contract ul{margin:0;padding-left:18px}.contract li,.command{overflow-wrap:anywhere}.command{font-family:ui-monospace,Consolas,monospace;font-size:.78rem;background:#061016;padding:10px;border-radius:4px;white-space:pre-wrap}
    dialog{width:min(94vw,1200px);max-height:92vh;background:var(--panel);color:var(--text);border:1px solid var(--line);border-radius:var(--r);padding:12px}dialog::backdrop{background:#000b}.dialog-head{display:flex;justify-content:space-between;gap:12px;align-items:center}.dialog-head button{padding:0 16px}.dialog-image{display:block;max-width:100%;max-height:78vh;margin:12px auto 0;object-fit:contain}.empty{padding:30px;border:1px dashed var(--line);color:var(--muted);text-align:center}
    @media(max-width:1000px){.metrics{grid-template-columns:repeat(3,1fr)}.filters{grid-template-columns:1fr 1fr}.comparison{grid-template-columns:1fr}.contracts{grid-template-columns:1fr}}
    @media(max-width:620px){header{padding:22px 16px}main{padding:18px 10px 40px}.metrics{grid-template-columns:1fr 1fr}.filters{grid-template-columns:1fr}.unit summary{grid-template-columns:1fr auto}.unit summary .pill:last-child{grid-column:1/-1;width:max-content}.files{grid-template-columns:1fr 1fr}.file img{height:100px}}
    @media(max-width:390px){.files{grid-template-columns:1fr}.metrics{grid-template-columns:1fr}}
    @media(prefers-reduced-motion:reduce){*,*::before,*::after{scroll-behavior:auto!important;animation:none!important;transition:none!important}}
  </style>
</head>

  <header>
    <div class="eyebrow" data-i18n="eyebrow">CURRENT-ONLY PRODUCTION WORKBENCH</div>
    <h1 data-i18n="title">Cardborne 비주얼 교체 워크벤치</h1>

    <div class="top-actions"><button class="language" id="language-toggle" type="button" aria-pressed="false">English</button></div>

    <div id="units"></div>
  </main>

    const $=id=>document.getElementById(id),esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
    const repoUrl=p=>'../../../'+String(p).replace(/^\.\//,'');
    const domain=u=>{const paths=[...u.current_files.map(f=>f.path),...u.deliverables.map(f=>f.target_path)];const g=paths.some(p=>p.includes('/gameplay/')),i=paths.some(p=>p.includes('/ui/'));return g&&!i?'gameplay':i&&!g?'ui':'mixed'};
    const formatBytes=n=>n==null?'—':n>1048576?(n/1048576).toFixed(1)+' MB':n>1024?Math.round(n/1024)+' KB':n+' B';
    function fileCard(file,isDeliverable){const path=isDeliverable?file.workbench_path:file.path,displayPath=isDeliverable?file.target_path:file.path,exists=!isDeliverable||file.observed_sha256;if(!exists)return `<article class="file"><div class="missing">${esc(strings[lang].targetRequired)}</div><span class="path">${esc(file.target_path)}</span><span class="meta">${file.width}×${file.height}</span></article>`;const hash=isDeliverable?file.observed_sha256:file.sha256,isImage=String(path).toLowerCase().endsWith('.png'),media=isImage?`<button type="button" data-image="${esc(repoUrl(path))}" data-title="${esc(displayPath)}"><img loading="lazy" src="${esc(repoUrl(path))}" alt="${esc(displayPath)}"></button>`:`<div class="missing">${esc(String(path).split('.').pop().toUpperCase())}</div>`;return `<article class="file">${media}<span class="path">${esc(displayPath)}</span><span class="meta">${file.width||'—'}×${file.height||'—'} · ${formatBytes(file.bytes)}<br>${esc(strings[lang].hash)}: ${esc(hash)}</span></article>`}
    function list(items){return items.length?`<ul>${items.map(x=>`<li class="path">${esc(x)}</li>`).join('')}</ul>`:'<span class="meta">—</span>'}
    function unitMarkup(u){const title=lang==='ko'?u.title_ko:u.title_en;const previews=u.preview_paths.length?`<div class="files">${u.preview_paths.map(p=>`<article class="file"><button type="button" data-image="${esc(repoUrl(p))}" data-title="${esc(p)}"><img loading="lazy" src="${esc(repoUrl(p))}" alt="${esc(title+' preview')}"></button><span class="path">${esc(p)}</span></article>`).join('')}</div>`:`<p class="meta">${strings[lang].noPreview}</p>`;const approved=u.approval?`<span class="pill approved_for_switch">${esc(u.approval.approved_by)} · ${esc(u.approval.approved_at)}</span>`:`<span class="meta">${strings[lang].notApproved}</span>`;return `<details class="unit"><summary><span class="unit-title"><strong>${esc(title)}</strong><small>${esc(u.id)}</small></span><span class="pill ${esc(u.status)}">${esc(u.status)}</span><span class="pill">${esc(u.switch_kind)}</span></summary><div class="unit-body"><p class="direction">${esc(u.direction_en)}</p><div class="comparison"><section class="side"><h3>${strings[lang].asis}</h3><div class="files">${u.current_files.map(f=>fileCard(f,false)).join('')||'<div class="empty">—</div>'}</div></section><section class="side"><h3>${strings[lang].tobe}</h3><div class="files">${u.deliverables.map(f=>fileCard(f,true)).join('')||'<div class="empty">—</div>'}</div></section></div><section class="preview-panel"><h3>${strings[lang].preview}</h3>${previews}</section><div class="contracts"><section class="contract"><h3>${strings[lang].consumers}</h3>${list([...u.consumer_paths,...u.consumer_asset_ids])}</section><section class="contract"><h3>${strings[lang].retire}</h3>${list(u.retire_paths)}</section><section class="contract"><h3>${strings[lang].approval}</h3>${approved}</section><section class="contract"><h3>${strings[lang].promote}</h3><div class="command">.\\tools\\validation\\validate_visual_replacement_workbench.ps1\n.\\tools\\design\\promote_visual_replacement_unit.ps1 -UnitId ${esc(u.id)}</div></section></div></div></details>`}
    function populate(select,values,label){select.innerHTML=`<option value="">${strings[lang].all}</option>`+values.map(v=>`<option value="${esc(v)}">${esc(label?label(v):v)}</option>`).join('')}
    function render(){document.documentElement.lang=lang;document.querySelectorAll('[data-i18n]').forEach(el=>el.textContent=strings[lang][el.dataset.i18n]);document.querySelectorAll('[data-i18n-placeholder]').forEach(el=>el.placeholder=strings[lang][el.dataset.i18nPlaceholder]);$('language-toggle').textContent=lang==='ko'?'English':'한국어';$('language-toggle').setAttribute('aria-pressed',lang==='en');const q=$('search').value.trim().toLowerCase(),d=$('domain-filter').value,s=$('status-filter').value,k=$('kind-filter').value;const visible=data.units.filter(u=>(!q||[u.id,u.title_en,u.title_ko,...u.current_files.map(f=>f.path),...u.deliverables.map(f=>f.target_path)].join(' ').toLowerCase().includes(q))&&(!d||domain(u)===d)&&(!s||u.status===s)&&(!k||u.switch_kind===k));$('result-count').textContent=visible.length+strings[lang].matches;$('units').innerHTML=data.categories.map(c=>{const rows=visible.filter(u=>u.category_id===c.id);return rows.length?`<section class="category"><div class="category-head"><h2>${esc(lang==='ko'?c.title_ko:c.title_en)}</h2><span>${rows.length}</span></div><div class="unit-list">${rows.map(unitMarkup).join('')}</div></section>`:''}).join('')||'<div class="empty">0</div>';bindImages()}
    function bindImages(){document.querySelectorAll('[data-image]').forEach(b=>b.onclick=()=>{lastFocus=b;$('dialog-title').textContent=b.dataset.title;const img=$('image-dialog').querySelector('img');img.src=b.dataset.image;img.alt=b.dataset.title;$('image-dialog').showModal();$('dialog-close').focus()})}
    let lastFocus=null;$('dialog-close').onclick=()=>$('image-dialog').close();$('image-dialog').addEventListener('close',()=>{if(lastFocus)lastFocus.focus()});$('image-dialog').addEventListener('click',e=>{if(e.target===$('image-dialog'))$('image-dialog').close()});
    $('metric-gameplay').textContent=data.summary.gameplay_png;$('metric-ui').textContent=data.summary.ui_png;$('metric-font').textContent=data.summary.font;$('metric-units').textContent=data.summary.units;$('metric-retire').textContent=data.summary.retire_only;
    populate($('domain-filter'),['gameplay','ui','mixed'],v=>strings[lang][v==='gameplay'?'gameplayDomain':v==='ui'?'uiDomain':'mixedDomain']);populate($('status-filter'),Object.keys(data.summary.statuses));populate($('kind-filter'),['replace','add','consolidate','retire']);
    ['search','domain-filter','status-filter','kind-filter'].forEach(id=>$(id).addEventListener('input',render));$('language-toggle').onclick=()=>{lang=lang==='ko'?'en':'ko';const dv=$('domain-filter').value,sv=$('status-filter').value,kv=$('kind-filter').value;populate($('domain-filter'),['gameplay','ui','mixed'],v=>strings[lang][v==='gameplay'?'gameplayDomain':v==='ui'?'uiDomain':'mixedDomain']);$('domain-filter').value=dv;populate($('status-filter'),Object.keys(data.summary.statuses));$('status-filter').value=sv;populate($('kind-filter'),['replace','add','consolidate','retire']);$('kind-filter').value=kv;render()};render();
  })();
  </script>
