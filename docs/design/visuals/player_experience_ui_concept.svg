<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900">
  <title>Cardborne production gameplay HUD concept</title>
  <desc>Gameplay-first HUD with compact health, resources, objective, context feedback, and a six-slot action bar.</desc>
  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#080b0d" flood-opacity="0.72"/>
    </filter>
    <pattern id="rock" width="96" height="48" patternUnits="userSpaceOnUse">
      <path d="M8 17h43M26 34h58" stroke="#454d4c" stroke-width="4" stroke-linecap="round" opacity="0.46"/>
    </pattern>
  </defs>

  <!-- World -->
  <rect width="1600" height="900" fill="#12181b"/>
  <circle cx="1270" cy="128" r="78" fill="#c7d4c1" opacity="0.1"/>
  <path d="M0 328L120 246 233 305 340 190 447 306 574 220 712 319 822 211 948 301 1070 169 1195 281 1328 204 1460 288 1600 180V560H0Z" fill="#1b2426"/>
  <path d="M0 455L156 368 292 424 442 330 616 438 772 344 930 420 1084 321 1238 407 1400 338 1600 410V620H0Z" fill="#24302f"/>

  <path d="M0 620L174 618 174 550 373 550 373 662 510 662 510 605 702 605 702 735 894 735 894 618 1078 618 1078 548 1260 548 1260 664 1432 664 1432 603 1600 603V900H0Z" fill="#303737"/>
  <path d="M0 620L174 618M174 550H373M373 662H510M510 605H702M702 735H894M894 618H1078M1078 548H1260M1260 664H1432M1432 603H1600" fill="none" stroke="#7f9f69" stroke-width="10"/>
  <path d="M0 620L174 618 174 550 373 550 373 662 510 662 510 605 702 605 702 735 894 735 894 618 1078 618 1078 548 1260 548 1260 664 1432 664 1432 603 1600 603V900H0Z" fill="url(#rock)"/>

  <path d="M1010 436h190l-24 20h-140Z" fill="#3d4646" stroke="#819b86" stroke-width="6"/>
  <path d="M1280 405h178l-23 20h-134Z" fill="#3d4646" stroke="#819b86" stroke-width="6"/>
  <path d="M1208 235v310" stroke="#b7b66a" stroke-width="9"/>
  <path d="M1198 266h20M1198 304h20M1198 342h20M1198 380h20M1198 418h20M1198 456h20M1198 494h20" stroke="#d2cb83" stroke-width="4"/>

  <!-- Pickups and actors -->
  <g transform="translate(566 552)" filter="url(#shadow)">
    <path d="M0 28L18 0l18 28-18 18Z" fill="#60d9c8" stroke="#b3fff1" stroke-width="4"/>
    <circle cx="18" cy="24" r="30" fill="none" stroke="#60d9c8" stroke-width="3" opacity="0.28"/>
  </g>
  <g transform="translate(1018 565)">
    <path d="M-24 0h48l8 20-11 40h-42l-11-40Z" fill="#b79b5e"/>
    <path d="M-29 5h58" stroke="#e3c77e" stroke-width="7"/>
    <circle cx="0" cy="27" r="7" fill="#1a2022"/>
  </g>
  <g transform="translate(785 728)" filter="url(#shadow)">
    <path d="M-19 0h38l9-54-12-32h-32l-12 32Z" fill="#b74338"/>
    <path d="M-16-86h32l-2-18h-28Z" fill="#d8d0b9"/>
    <path d="M-26-48l-26 22 10 9 24-14M26-48l25 22-10 9-24-14" fill="#737f80"/>
    <path d="M19-69l22 19-8 9-22-18Z" fill="#d9b44a"/>
  </g>
  <g transform="translate(354 548)">
    <path d="M-24 0h48v-48l-12-18h-24l-12 18Z" fill="#873e50"/>
    <path d="M-34-31h68" stroke="#d35a6f" stroke-width="9"/>
    <circle cx="0" cy="-48" r="7" fill="#f2b45c"/>
  </g>
  <g transform="translate(1378 599)">
    <path d="M-24 0h48v-58h-48Z" fill="#455c64"/>
    <path d="M-31-35h62M0-68v20" stroke="#74bfcc" stroke-width="7"/>
    <circle cx="0" cy="-70" r="10" fill="#d4eef0"/>
  </g>

  <!-- Top-left player status -->
  <g transform="translate(34 30)" filter="url(#shadow)">
    <path d="M0 24L24 0h366l20 20v84H26L0 78Z" fill="#171d20" fill-opacity="0.95" stroke="#5c6868" stroke-width="2"/>
    <circle cx="63" cy="52" r="37" fill="#273033" stroke="#d5aa46" stroke-width="4"/>
    <path d="M44 67h38l6-27-12-17H54L42 40Z" fill="#b74338"/>
    <path d="M52 25h25l-2-10H55Z" fill="#d8d0b9"/>
    <text x="112" y="24" fill="#e7e7dd" font-family="Segoe UI, sans-serif" font-size="16" font-weight="700">WARRIOR</text>
    <rect x="112" y="35" width="250" height="22" rx="3" fill="#31383a"/>
    <rect x="115" y="38" width="205" height="16" rx="2" fill="#c64e45"/>
    <path d="M155 37v18M195 37v18M235 37v18M275 37v18M315 37v18" stroke="#772f2b" stroke-width="2"/>
    <text x="368" y="52" text-anchor="end" fill="#f5eee0" font-family="Segoe UI, sans-serif" font-size="14" font-weight="700">5 / 7</text>
    <rect x="112" y="68" width="250" height="7" rx="3" fill="#30393c"/>
    <rect x="112" y="68" width="166" height="7" rx="3" fill="#55b7c5"/>
    <text x="112" y="95" fill="#aeb8b5" font-family="Segoe UI, sans-serif" font-size="13">LV 5</text>
    <text x="164" y="95" fill="#75817f" font-family="Segoe UI, sans-serif" font-size="13">158 / 220 XP</text>
  </g>

  <!-- Objective -->
  <g transform="translate(800 38)">
    <path d="M-214 0h428" stroke="#65716f" stroke-width="2" opacity="0.7"/>
    <text x="0" y="28" text-anchor="middle" fill="#d7ddd6" font-family="Segoe UI, sans-serif" font-size="17" font-weight="700">BROKEN SANCTUM</text>
    <text x="0" y="50" text-anchor="middle" fill="#aeb8b5" font-family="Segoe UI, sans-serif" font-size="14">Defeat the sentries</text>
  </g>

  <!-- Top-right resources -->
  <g transform="translate(1250 35)" filter="url(#shadow)">
    <path d="M0 0h296l20 20v70H0Z" fill="#171d20" fill-opacity="0.93" stroke="#5c6868" stroke-width="2"/>
    <circle cx="33" cy="34" r="13" fill="#d4aa43" stroke="#f2d17a" stroke-width="3"/>
    <text x="55" y="40" fill="#f1eadc" font-family="Segoe UI, sans-serif" font-size="17" font-weight="700">25</text>
    <path d="M113 47L128 18l15 29-15 12Z" fill="#62cbbd" stroke="#aff4ea" stroke-width="2"/>
    <text x="151" y="40" fill="#f1eadc" font-family="Segoe UI, sans-serif" font-size="17" font-weight="700">8</text>
    <path d="M205 18h26l9 17-9 17h-26l-9-17Z" fill="#9a86bf" stroke="#d5c9ef" stroke-width="2"/>
    <text x="249" y="40" fill="#f1eadc" font-family="Segoe UI, sans-serif" font-size="17" font-weight="700">3</text>
    <text x="31" y="72" fill="#75817f" font-family="Segoe UI, sans-serif" font-size="12">COIN</text>
    <text x="112" y="72" fill="#75817f" font-family="Segoe UI, sans-serif" font-size="12">SCRAP</text>
    <text x="200" y="72" fill="#75817f" font-family="Segoe UI, sans-serif" font-size="12">THREAD</text>
  </g>

  <!-- Context lane -->
  <g transform="translate(800 668)" filter="url(#shadow)">
    <path d="M-188 0h376l16 16-16 44h-376l-16-44Z" fill="#182124" fill-opacity="0.96" stroke="#59c8b8" stroke-width="2"/>
    <path d="M-160 30L-146 9l14 21-14 12Z" fill="#59c8b8"/>
    <text x="-112" y="27" fill="#d8f3ec" font-family="Segoe UI, sans-serif" font-size="15" font-weight="700">HEALING SHARD</text>
    <text x="116" y="27" fill="#7de1c5" font-family="Segoe UI, sans-serif" font-size="15" font-weight="700">+1 HP</text>
    <text x="0" y="48" text-anchor="middle" fill="#7f8b89" font-family="Segoe UI, sans-serif" font-size="12">Recovered from a side path</text>
  </g>

  <!-- Class state -->
  <g transform="translate(800 744)">
    <text x="-72" y="0" fill="#9eaaa7" font-family="Segoe UI, sans-serif" font-size="12" font-weight="700">RESOLVE</text>
    <path d="M12-14l12 5v10c0 9-7 14-12 17C7 15 0 10 0 1V-9Z" fill="#d0a846" stroke="#f1d374" stroke-width="2"/>
    <path d="M44-14l12 5v10c0 9-7 14-12 17-5-3-12-8-12-17V-9Z" fill="#d0a846" stroke="#f1d374" stroke-width="2"/>
    <path d="M76-14l12 5v10c0 9-7 14-12 17-5-3-12-8-12-17V-9Z" fill="#30383a" stroke="#6d7977" stroke-width="2"/>
  </g>

  <!-- Action bar -->
  <g transform="translate(507 766)" filter="url(#shadow)" font-family="Segoe UI, sans-serif">
    <path d="M-20 8L0-8h586l20 16v98l-20 18H0l-20-18Z" fill="#111619" fill-opacity="0.96" stroke="#4e5a59" stroke-width="2"/>

    <g transform="translate(8 8)">
      <rect width="84" height="96" rx="5" fill="#242b2d" stroke="#c9a94c" stroke-width="2"/>
      <rect x="6" y="6" width="24" height="22" rx="3" fill="#111719"/>
      <text x="18" y="22" text-anchor="middle" fill="#f4e7bd" font-size="13" font-weight="700">F</text>
      <path d="M28 70L62 34M33 31l28 28M25 76l13-5-8-8Z" stroke="#e2c461" stroke-width="6" stroke-linecap="round" fill="none"/>
      <text x="42" y="90" text-anchor="middle" fill="#b9c2bf" font-size="10">CLEAVE</text>
    </g>

    <g transform="translate(102 8)">
      <rect width="84" height="96" rx="5" fill="#242b2d" stroke="#65716f" stroke-width="2"/>
      <rect x="6" y="6" width="24" height="22" rx="3" fill="#111719"/>
      <text x="18" y="22" text-anchor="middle" fill="#e2e5df" font-size="13" font-weight="700">G</text>
      <path d="M31 32h22v14H31ZM42 46v27M29 72h27" fill="none" stroke="#d28f47" stroke-width="7" stroke-linejoin="round"/>
      <text x="42" y="90" text-anchor="middle" fill="#b9c2bf" font-size="10">BREAKER</text>
    </g>

    <g transform="translate(196 8)">
      <rect width="84" height="96" rx="5" fill="#263237" stroke="#63bdc8" stroke-width="3"/>
      <rect x="6" y="6" width="24" height="22" rx="3" fill="#111719"/>
      <text x="18" y="22" text-anchor="middle" fill="#d7f5f6" font-size="13" font-weight="700">Q</text>
      <path d="M24 68h36V44L42 30 24 44ZM18 70h48" fill="none" stroke="#68c9d2" stroke-width="5" stroke-linejoin="round"/>
      <text x="42" y="90" text-anchor="middle" fill="#d7f5f6" font-size="10">RUSH</text>
    </g>

    <g transform="translate(290 8)">
      <rect width="84" height="96" rx="5" fill="#202729" stroke="#65716f" stroke-width="2"/>
      <rect x="6" y="6" width="24" height="22" rx="3" fill="#111719"/>
      <text x="18" y="22" text-anchor="middle" fill="#e2e5df" font-size="13" font-weight="700">R</text>
      <path d="M15 63l16-12 12 11 10-20 16 21" fill="none" stroke="#d99c4c" stroke-width="5" stroke-linejoin="round"/>
      <path d="M0 8h84v53c-11 12-24 18-42 18S11 73 0 61Z" fill="#0e1315" opacity="0.53"/>
      <text x="42" y="60" text-anchor="middle" fill="#f0dfb0" font-size="18" font-weight="700">3.2</text>
      <text x="42" y="90" text-anchor="middle" fill="#899390" font-size="10">SPLITTER</text>
    </g>

    <g transform="translate(384 8)">
      <rect width="84" height="96" rx="5" fill="#242b2d" stroke="#65716f" stroke-width="2"/>
      <rect x="6" y="6" width="24" height="22" rx="3" fill="#111719"/>
      <text x="18" y="22" text-anchor="middle" fill="#e2e5df" font-size="13" font-weight="700">V</text>
      <path d="M35 72V30M38 33h25l-7 10 7 10H38" fill="none" stroke="#d7b74e" stroke-width="6" stroke-linejoin="round"/>
      <text x="42" y="90" text-anchor="middle" fill="#b9c2bf" font-size="10">RALLY</text>
    </g>

    <g transform="translate(478 8)">
      <rect width="84" height="96" rx="5" fill="#25302d" stroke="#6dbb8f" stroke-width="2"/>
      <rect x="6" y="6" width="24" height="22" rx="3" fill="#111719"/>
      <text x="18" y="22" text-anchor="middle" fill="#ddf6e8" font-size="13" font-weight="700">H</text>
      <path d="M31 31h22v12l8 10-7 22H30l-7-22 8-10Z" fill="#72c991" stroke="#b8edc9" stroke-width="3"/>
      <text x="65" y="72" text-anchor="middle" fill="#f5f0df" font-size="17" font-weight="700">x1</text>
      <text x="42" y="90" text-anchor="middle" fill="#c8e8d3" font-size="10">POTION</text>
    </g>
  </g>

  <text x="32" y="875" fill="#65716f" font-family="Segoe UI, sans-serif" font-size="12">UI CONCEPT - GAMEPLAY VIEW - 1600 x 900</text>
</svg>
