<svg xmlns="http://www.w3.org/2000/svg" width="32" height="32" viewBox="0 0 32 32"
     shape-rendering="crispEdges">
  <metadata>
    Manually cleaned from 04-auto-ship-32.svg.
    Native logical grid: 32 by 32 pixels.
    Symmetry axis: between columns 15 and 16.
    Palette: #141B24 #202833 #222B35 #44515E #65A9B8 #D9A83D.
  </metadata>

  <!-- Symmetric primary silhouette. Integer vertices make one-pixel edits direct. -->
  <path id="chassis" fill="#44515E" d="
    M15 3h2v2h1v2h1v2h1v3h1v3h1v1h2v1h2v4h-4v1h-1v5h-4v-2h-2v2h-4v-5h-1v-1H6v-4h2v-1h2v-1h1v-3h1V9h1V7h1V5h1z"/>

  <!-- Dark material breaks up the mass without a continuous outer outline. -->
  <path id="dark-panels" fill="#202833" d="
    M15 3h2v7h2v5h2v2h4v4h-5v2h-3v3h-2v-3h-3v-2H7v-4h4v-2h2v-5h2z"/>
  <rect x="6" y="19" width="5" height="2" fill="#222B35"/>
  <rect x="21" y="19" width="5" height="2" fill="#222B35"/>

  <!-- Forward cannon and cockpit remain separate future animation layers. -->
  <rect id="cannon-socket" x="15" y="3" width="2" height="4" fill="#141B24"/>
  <rect x="14" y="10" width="4" height="1" fill="#65A9B8"/>
  <path id="cockpit-frame" fill="#D9A83D" d="M14 11h4v1h1v5h-1v1h-4v-1h-1v-5h1z"/>
  <rect id="cockpit" x="15" y="12" width="2" height="5" fill="#141B24"/>

  <!-- Sparse ownership accents; cyan is not used as a full silhouette outline. -->
  <rect x="8" y="16" width="4" height="1" fill="#65A9B8"/>
  <rect x="20" y="16" width="4" height="1" fill="#65A9B8"/>
  <rect x="6" y="18" width="2" height="1" fill="#65A9B8"/>
  <rect x="24" y="18" width="2" height="1" fill="#65A9B8"/>
  <rect x="10" y="21" width="2" height="2" fill="#65A9B8"/>
  <rect x="20" y="21" width="2" height="2" fill="#65A9B8"/>

  <!-- Player ownership marks and engine-module anchors. -->
  <rect x="6" y="19" width="3" height="1" fill="#D9A83D"/>
  <rect x="23" y="19" width="3" height="1" fill="#D9A83D"/>
  <rect x="11" y="23" width="4" height="4" fill="#222B35"/>
  <rect x="17" y="23" width="4" height="4" fill="#222B35"/>
  <rect x="12" y="24" width="2" height="2" fill="#141B24"/>
  <rect x="18" y="24" width="2" height="2" fill="#141B24"/>
  <rect x="11" y="26" width="4" height="1" fill="#D9A83D"/>
  <rect x="17" y="26" width="4" height="1" fill="#D9A83D"/>
</svg>
