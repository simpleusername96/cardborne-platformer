<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Cardborne First Slice UI Code Mockup</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div class="app-shell">
      <header class="topbar">
        <div>
          <p class="eyebrow">First slice code mockup</p>
          <h1>Cardborne Platformer</h1>
        </div>
        <div class="seed-controls" aria-label="Seed controls">
          <label for="seedInput">Seed</label>
          <input id="seedInput" inputmode="numeric" type="number" min="1" step="1" />
          <button type="button" class="button ghost" data-action="random-seed">Random</button>
          <button type="button" class="button primary" data-action="regenerate">Generate</button>
        </div>
      </header>

      <div class="workspace">
        <nav class="screen-nav" aria-label="Mockup screens">
          <p class="nav-label">Screens</p>
          <div id="screenNav" class="screen-nav-list"></div>
        </nav>

        <main id="screenRoot" class="screen-root" tabindex="-1"></main>

        <aside id="inspector" class="inspector" aria-label="Screen implementation notes"></aside>
      </div>

      <div id="status" class="sr-only" aria-live="polite"></div>
    </div>

    <script src="app.js" defer></script>
  </body>
</html>
